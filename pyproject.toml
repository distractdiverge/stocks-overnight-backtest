[project]
name = "stocks-overnight-backtest"
version = "0.1.0"
description = "Paper-only research tools for testing overnight-return and AI-infrastructure market patterns"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yfinance>=0.2.28",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
